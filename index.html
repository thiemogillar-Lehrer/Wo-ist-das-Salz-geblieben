      complete:(u,v)=>Array.isArray(v)&&v.length>0&&v.every(i=>choiceValid(u,i)),

      solution:u=>u.answer.map(i=>u.options[i]).join('; ')

    boolean: {valid:(_,v)=>typeof v==='boolean',complete:(_,v)=>typeof v==='boolean',correct:(u,v)=>u.answer===v,solution:u=>u.answer?'Richtig':'Falsch'},
    text: {valid:textValid,complete:(_,v)=>typeof v==='string'&&normalize(v)!=='',correct:(u,v)=>u.accepted.some(a=>normalize(a)===normalize(v)),solution:u=>u.accepted[0]},
    select: {valid:(u,v)=>typeof v==='string'&&(v===''||u.options.includes(v)),complete:(u,v)=>typeof v==='string'&&v!==''&&u.options.includes(v),correct:(u,v)=>v===u.answer,solution:u=>u.answer}

      const base=(id,detail)=>({...common,id,...detail});
      switch(block.type||'single') {
        case 'single':case 'multiple':return [base(block.id,{type:block.type||'single',prompt:block.prompt,options:block.options,answer:block.answer})];
        case 'text':return [base(block.id,{type:'text',prompt:block.prompt,accepted:block.accepted})];
        case 'true-false':return block.statements.map(item=>base(block.id+'.'+item.id,{type:'boolean',prompt:item.text,answer:item.answer,explanation:item.explanation||common.explanation}));
        case 'gap-text':return block.blanks.map(item=>base(block.id+'.'+item.id,{type:'text',prompt:item.label,accepted:item.accepted,explanation:item.explanation||common.explanation}));

(function(root) {

  function createEngine(content,storage) {

    }
    function sectionDone(i) {return content.sections[i].tasks.every(t=>taskStatus(t.id));}

              item.hintsUsed=Number.isInteger(p.hintsUsed)?Math.max(0,Math.min(p.hintsUsed,record.hintsShown+Number(record.differentiatedShown))):0;
              if(unlocked&&p.status==='solution'&&item.attempts===3) {item.status='solution';item.solutionShown=true;}
              else if(unlocked&&statuses.includes(p.status)&&rule.complete(unit,item.answer)&&rule.correct(unit,item.answer))item.status=item.hintsUsed?'helped':'independent';
              item.feedback=feedback(item);
            }
            state.collapsed[task.id]=!!saved.collapsed?.[task.id]&&!!taskStatus(task.id);
          }
          if(Number.isInteger(saved.section))state.section=Math.max(0,Math.min(saved.section,lastUnlocked()));
        }
      }
    } catch(_) {storageAvailable=false;}
    function save() {try {storage.setItem(key,JSON.stringify(state));storageAvailable=true;}catch(_){storageAvailable=false;}}
    function answer(id,unitId,value) {
      const task=byId.get(id);if(!task||!taskUnlocked(id)||taskStatus(id))return false;
      const unit=adapter.units(task).find(u=>u.id===unitId),part=state.tasks[id].units[unitId];
      if(!unit||part.status||!adapter.types[unit.type].valid(unit,value))return false;
      part.answer=clone(value);state.tasks[id].message='';save();return true;
    }
    function check(id) {
      const task=byId.get(id);if(!task||!taskUnlocked(id)||taskStatus(id)||task.type==='notebook')return {kind:'ignored'};
      const record=state.tasks[id],units=adapter.units(task),open=units.filter(u=>!record.units[u.id].status);
      if(open.some(u=>!adapter.types[u.type].complete(u,record.units[u.id].answer))) {
        record.message='Bitte bearbeite die Aufgabe vollständig. Unvollständige Eingaben zählen nicht als Fehlversuch.';save();return {kind:'incomplete'};
      }
      record.message='';
      const results=open.map(unit=>({unit,correct:adapter.types[unit.type].correct(unit,record.units[unit.id].answer)&&(!unit.unique||!units.some(other=>other.id!==unit.id&&other.group===unit.group&&record.units[other.id].answer===record.units[unit.id].answer))}));
      for(const {unit,correct} of results) {
        const part=record.units[unit.id];
        if(correct)part.status=part.hintsUsed?'helped':'independent';
        else {part.attempts++;if(part.attempts>=3){part.status='solution';part.solutionShown=true;}}
        part.feedback=feedback(part);
      }
      save();return {kind:taskStatus(id)?'complete':'incorrect'};
    }
    function revealHint(id) {
      const task=byId.get(id);if(!task||!taskUnlocked(id)||taskStatus(id))return false;
      const record=state.tasks[id];if(record.hintsShown>=(task.hints||[]).length)return false;
      record.hintsShown++;
      record.highestHintOpened=Math.max(record.highestHintOpened,record.hintsShown);
      for(const part of Object.values(record.units))if(!part.status)part.hintsUsed=record.hintsShown+Number(record.differentiatedShown);
      save();return true;
    }
    return {
      get state(){return state;},get storageAvailable(){return storageAvailable;},get key(){return key;},
      get completed(){return tasks.filter(t=>taskStatus(t.id)).map(t=>t.id);},
      get progress(){return Math.round(tasks.filter(t=>taskStatus(t.id)).length/tasks.length*100);},
      taskStatus,statusLabel:id=>labels[taskStatus(id)]||'Jetzt bearbeiten',sectionDone,lastUnlocked,taskUnlocked,
      record:id=>state.tasks[id],start(){state.started=true;save();},
      navigate(i){if(Number.isInteger(i)&&i>=0&&i<=lastUnlocked()){state.section=i;save();return true;}return false;},
      answer,check,revealHint,
      helpLabel(id) {return ['Selbstständig bearbeitet','Kaum Hilfe genutzt','Wenig Hilfe genutzt','Mehr Hilfe genutzt','Zusätzliche Unterstützung genutzt'][state.tasks[id].highestHintOpened];},
      revealDifferentiated(id) {
        const task=byId.get(id);if(!task?.differentiatedHelp||!taskUnlocked(id)||taskStatus(id)||state.tasks[id].differentiatedShown)return false;
        const record=state.tasks[id];record.differentiatedShown=true;
        record.highestHintOpened=4;
        for(const part of Object.values(record.units))if(!part.status)part.hintsUsed=record.hintsShown+1;
        save();return true;
      },
      hintPrompt(id) {
        const task=byId.get(id),record=state.tasks[id];
        if(taskStatus(id)||!Object.values(record.units).some(p=>!p.status&&p.attempts>=2))return '';
        if(record.hintsShown<(task.hints||[]).length)return 'Nutze jetzt Hilfe '+(record.hintsShown+1)+' über „? Hilfe“, bevor du erneut prüfst.';
        return record.hintsShown?'Lies die bereits geöffneten Hilfen noch einmal, bevor du erneut prüfst.':'Diese Aufgabe hat keine Hilfe. Lies noch einmal das Material.';
      },
      markWritten(id){if(byId.get(id)?.type==='notebook'&&taskUnlocked(id)&&!taskStatus(id)){state.tasks[id].notebookDone=true;save();return true;}return false;},
      toggleComparison(id){if(taskStatus(id)==='notebook'){state.tasks[id].comparisonShown=!state.tasks[id].comparisonShown;save();}},
      toggle(id){if(taskStatus(id)){state.collapsed[id]=!state.collapsed[id];save();}},
      reset(){try{storage.removeItem(key);storageAvailable=true;}catch(_){storageAvailable=false;}state=fresh();}
    };
  }
  root.ChemistryState={createEngine};
})(typeof window!=='undefined'?window:globalThis);

  function render(task,engine,options={}) {
    const format=root.ChemistryText?.format||escape, display=root.ChemistryText?.display||escape;
    const adapter=root.ChemistryTasks,record=engine.record(task.id),units=adapter.units(task);
    function input(unit,inline=false) {
      const part=record.units[unit.id],name=task.id+'-'+unit.id;
      const attr=`data-task="${escape(task.id)}" data-unit="${escape(unit.id)}" data-kind="${unit.type}"`;
      const disabled=part.status?'disabled':'';
      if(unit.type==='single'||unit.type==='multiple'||unit.type==='boolean') {
        const options=unit.type==='boolean'?['Richtig','Falsch']:unit.options;
        return `<fieldset class="unit-input" ${disabled}><legend>${format(unit.prompt)}</legend>${unit.type==='multiple'?'<p class="muted">Mehrere Antworten können richtig sein.</p>':''}${options.map((option,i)=>{
          const value=unit.type==='boolean'?i===0:i;
          const checked=unit.type==='multiple'?(part.answer||[]).includes(i):part.answer===value;
          return `<label class="option"><input type="${unit.type==='multiple'?'checkbox':'radio'}" name="${escape(name)}" value="${value}" ${attr} ${checked?'checked':''}><span>${display(option)}</span></label>`;
        }).join('')}</fieldset>`;
      }
      if(unit.type==='text')return `<label class="${inline?'gap-field':'text-field'}"><span ${inline?'class="sr-only"':''}>${format(unit.prompt)}</span><input type="text" autocomplete="off" spellcheck="false" autocapitalize="none" value="${escape(part.answer)}" ${attr} ${disabled}></label>`;
      const used=units.filter(other=>other.id!==unit.id&&other.group===unit.group).map(other=>record.units[other.id].answer);
      return `<label class="${inline?'gap-field':'text-field'}"><span ${inline?'class="sr-only"':''}>${format(unit.prompt)}</span><select ${attr} ${disabled}><option value="">Bitte wählen …</option>${unit.options.map(option=>`<option value="${escape(option)}" ${part.answer===option?'selected':''} ${unit.unique&&used.includes(option)&&part.answer!==option?'disabled':''}>${display(option)}</option>`).join('')}</select></label>`;
    }

        html+=escape(block.template.slice(offset))+'</div>'+group.map(response).join('');
      } else if(block.type==='notebook')html=`${options.notebookInstruction===false?'':'<p class="notebook-instruction"><strong>✎ Bearbeite diese Aufgabe in deiner <u>Chemiemappe</u>.</strong></p>'}<p>${format(block.prompt)}</p>`;

<script>
(() => {
  'use strict';
  const content = window.ChemistryContent;
  let storage;
  try { storage = window.localStorage; } catch (_) { storage = {getItem(){throw Error();},setItem(){throw Error();},removeItem(){throw Error();}}; }
  const engine = window.ChemistryState.createEngine(content, storage);
  const main = document.querySelector('#main'), status = document.querySelector('#learning-status'), nav = document.querySelector('#bottom-nav');
  const backdrop = document.querySelector('#dialog-backdrop');
  let view = 'home', returnFocus, materialReturn = null;
  const escape = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const {format,display}=window.ChemistryText;
  const sectionTitle=section=>section.kind==='experiment'&&!section.title.startsWith('Versuch:')?'Versuch: '+section.title:section.title;
  const materialNumber=(index,local)=>content.sections.slice(0,index).reduce((sum,s)=>sum+s.materials.length,0)+local+1;
  const button = (label, action, extra='') => `<button data-action="${action}" ${extra}>${label}</button>`;
  const starsExplanation='Die Sterne zeigen, wie viele Hilfen du genutzt hast. Sie bewerten nicht, ob deine Antwort richtig ist.';
  const completionTitle='Geschafft! Du hast die Lernumgebung abgeschlossen!';
  const requiredDone=()=>content.sections.every((section,i)=>section.optional===true||engine.sectionDone(i));
  const stars=(id,print=false)=>{
    const level=engine.record(id).highestHintOpened;
    return `<div class="help-stars" role="img" aria-label="Höchste Hilfestufe: ${level||'keine'}; ${5-level} von 5 ${print?'gefüllten':'gelben'} Sternen"><b aria-hidden="true">${'★'.repeat(5-level)}</b><b aria-hidden="true">${(print?'☆':'★').repeat(level)}</b></div>`;
  };
  function celebration(title,body) {
    return `<div class="success section-complete"><div class="celebration-decoration" aria-hidden="true">▪ <b>✦</b> · <b>★</b> · <b>✦</b> ▪</div><strong>${title}</strong>${body}</div>`;
  }
  function sectionSuccess() {
    const i=engine.state.section;
    if(!engine.sectionDone(i))return '';
    const hasNext=i<content.sections.length-1;
    const next=hasNext?button('Nächster Abschnitt →','next','class="primary"'):button('Lernstand ansehen','overview','class="primary"');
    const finished=requiredDone();
    return (hasNext||!finished?celebration('Gut gemacht! Du hast diesen Lernabschnitt geschafft!',hasNext?'<p>Du kannst jetzt zum nächsten Abschnitt weitergehen.</p>'+next:next):'')
      +(finished?celebration(completionTitle,'<p>Du hast alle Pflichtaufgaben bearbeitet. Deinen Lernstand findest du in der Übersicht.</p>'+button('Lernstand ansehen','overview','class="primary"')):'');
  }
  function overviewStatus(task) {
    if(engine.taskStatus(task.id))return engine.statusLabel(task.id);
    if(!engine.taskUnlocked(task.id))return '○ Gesperrt';
    return Object.values(engine.record(task.id).units).some(p=>p.answer!==undefined)?'◐ In Bearbeitung':'→ Bereit';
  }
  const showsOverviewStars = task => Boolean((task.hints?.length || task.differentiatedHelp) && engine.taskStatus(task.id));
  function overviewSections(print=false) {
    return content.sections.map((section,i)=>`<section class="panel overview-section"><h2>${i+1} · ${display(sectionTitle(section))}</h2><ul>${section.tasks.map(task=>`<li><span>${escape(overviewStatus(task))}</span> ${display(task.title)}${showsOverviewStars(task)?stars(task.id,print):''}${print?'':`<small class="help-summary">${escape(engine.helpLabel(task.id))}</small>`}</li>`).join('')}</ul>${print?'':button(i>engine.lastUnlocked()?'Abschnitt gesperrt':'Abschnitt öffnen','section',`data-index="${i}" ${i>engine.lastUnlocked()?'disabled':''}`)}</section>`).join('');
  }
  function overviewCount() {
    return `${engine.completed.length} von ${content.sections.flatMap(s=>s.tasks).length} Aufgaben abgeschlossen · ${engine.progress} %`;
  }
  function starsSummary() {
    const items = content.sections.flatMap((section,i)=>section.tasks.flatMap((task,j)=>showsOverviewStars(task)?[`<li><small>Abschnitt ${i+1} · Aufgabe ${task.number??j+1}</small><br>${display(task.title)}${stars(task.id)}</li>`]:[]));
    return items.length ? `<section class="stars-summary"><h2>Sterne im Überblick</h2><ol>${items.join('')}</ol></section>` : '';
  }
  function printOverview() {
    if(view!=='overview'||!requiredDone())return;
    const name=main.querySelector('#print-name').value.trim();
    const group=main.querySelector('#print-class').value.trim();
    document.getElementById('print-report')?.remove();
    document.body.insertAdjacentHTML('beforeend',`<article id="print-report"><h1>${display(content.title)}</h1><p><strong>Name:</strong> ${escape(name)||'________________'} · <strong>Klasse:</strong> ${escape(group)||'________'}</p><p><strong>Datum:</strong> ${escape(new Date().toLocaleDateString('de-DE'))}</p><h2>Lernstandsübersicht</h2><p>${overviewCount()}</p><p>${starsExplanation} Im Ausdruck stehen leere Sterne für genutzte Hilfestufen.</p>${overviewSections(true)}</article>`);
    document.body.classList.add('printing-report');
    window.print();
  }
  window.addEventListener('afterprint',()=>{
    document.getElementById('print-report')?.remove();
    document.body.classList.remove('printing-report');
  });
  if (content.logo) {
    const slot = document.querySelector('#school-logo'), img = document.createElement('img');
    img.alt = 'Schullogo · ' + content.school; img.src = content.logo;
    img.addEventListener('error', () => { slot.hidden = true; });
    slot.append(img); slot.hidden = false;
  }
  function scrollToTarget(id) {
    const element = document.getElementById(id);
    if (!element) return;
    element.setAttribute('tabindex', '-1');
    element.focus({preventScroll:true});
    const top = element.getBoundingClientRect().top + window.scrollY - status.getBoundingClientRect().height - 16;
    window.scrollTo({top:Math.max(0,top),behavior:'auto'});
  }
  function warning() { return engine.storageAvailable ? '' : '<p class="storage-warning" role="status">Die lokale Speicherung ist hier nicht verfügbar. Dein Lernstand bleibt nur während dieser geöffneten Sitzung erhalten.</p>'; }
  function render(focus=false) {
    const active = view !== 'home';
    document.querySelector('.masthead').classList.toggle('branding-home', !active);
    document.querySelector('.masthead').classList.toggle('branding-compact', active);
    status.hidden = nav.hidden = !active;
    status.innerHTML = `<div class="shell"><nav class="learning-path" aria-label="Lernweg">${content.sections.map((section,i) => {const done=engine.sectionDone(i), locked=i>engine.lastUnlocked();return `<button data-action="section" data-index="${i}" ${locked?'disabled':''} ${view==='section'&&i===engine.state.section?'aria-current="step"':''} class="${done?'done':''}"><span class="step-number">${done?'✓':i+1}</span><span>${display(sectionTitle(section))}<small>${done?'Abgeschlossen':locked?'Gesperrt':i===engine.state.section?'Aktuell':'Freigeschaltet'}</small></span></button>`;}).join('')}</nav><div class="progress-label"><span>Gesamtfortschritt${requiredDone()?' <span class="completion-icon" role="img" aria-label="Lernumgebung abgeschlossen">★</span>':''}</span><strong>${engine.progress} %</strong></div><div class="progress" role="progressbar" aria-label="Gesamtfortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${engine.progress}"><span style="width:${engine.progress}%"></span></div>${view==='section'&&content.sections[engine.state.section].kind==='experiment'?'<div class="safety-goggles"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJTY2h1dHpicmlsbGUgdHJhZ2VuIj4KICA8Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSIzMSIgZmlsbD0iIzE1NjViNSIvPgogIDxnIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIzLjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+CiAgICA8cGF0aCBkPSJNMTAgMjZsNyAzbTMwIDAgNy0zTTI5IDMyYzItMiA0LTIgNiAwIi8+CiAgICA8cGF0aCBkPSJNMTcgMjdoMTBsMiA0LTEgMTFIMTdsLTMtMTJ6bTIwIDBoMTBsMyAzLTMgMTJIMzZsLTEtMTF6IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9Ii4xMiIvPgogIDwvZz4KPC9zdmc+Cg==" alt="Schutzbrillen-Piktogramm"><strong>Schutzbrille tragen.</strong></div>':''}</div>`;
    nav.innerHTML = `<div class="shell">${button('← Zurück','back', view==='section'&&engine.state.section===0?'disabled':'')}${button('Material','material')}${button('Übersicht','overview',view==='overview'?'aria-current="page"':'')}${button('Weiter →','next',view==='section'&&!engine.sectionDone(engine.state.section)?'disabled':'')}</div>`;
    if(view==='home') renderHome();
    if(view==='section') renderSection();
    if(view==='overview') renderOverview();
    main.insertAdjacentHTML('afterbegin',warning());
    if(focus) { main.focus(); window.scrollTo({top:0,behavior:'auto'}); }
  }
  function renderHome() {
    main.innerHTML = `<section class="hero"><p class="eyebrow">${escape(content.subject)} / ${escape(content.grade)}</p><h1>${display(content.title)}</h1><p class="subtitle">${display(content.subtitle)}</p><p>${format(content.introduction)}</p><div class="actions">${engine.state.started?button('Weiterarbeiten','start','class="primary"')+button('Neu beginnen','reset'):button('Lernumgebung starten','start','class="primary"')}</div>${engine.state.started?`<p class="saved">Dein gespeicherter Lernstand: ${engine.progress} % abgeschlossen</p>`:''}</section><div class="home-grid"><section class="panel"><p class="eyebrow">Dein Ziel</p><h2>Das lernst du</h2><ul class="objectives">${content.objectives.map(t=>`<li>${display(t)}</li>`).join('')}</ul></section><section class="panel"><h2>Gut vorbereitet</h2><p><strong>Bearbeitungszeit</strong><br>${escape(content.duration)}</p><strong>Benötigte Materialien</strong><ul>${content.supplies.map(t=>`<li>${display(t)}</li>`).join('')}</ul></section></div><p class="muted">Deine Antworten werden auf diesem Gerät in diesem Browser gespeichert. Es wird kein Konto benötigt.</p>`;
  }
  function renderSection() {

    main.innerHTML = `<section class="section-intro"><p class="eyebrow">Abschnitt ${engine.state.section+1} von ${content.sections.length}</p><h1>${display(sectionTitle(section))}</h1><p>${format(section.introduction)}</p>${section.notebookInstruction?`<p class="notebook-instruction section-notebook-instruction"><strong>${format(section.notebookInstruction)}</strong></p>`:''}${section.safety?.length?`<ul class="experiment-notices">${section.safety.map(text=>`<li>${escape(text)}</li>`).join('')}</ul>`:''}</section>${renderMaterials(section)}${section.note?`<aside class="note"><strong>MERKE</strong><p>${format(section.note)}</p></aside>`:''}<div class="tasks">${section.tasks.map((task,i)=>renderTask(task,i)).join('')}</div>${sectionSuccess()}`;
  }
  function renderTask(task,i) {
    const done=!!engine.taskStatus(task.id),locked=!engine.taskUnlocked(task.id),collapsed=engine.state.collapsed[task.id];
    if(locked)return `<section class="task locked"><span class="badge">Gesperrt</span><h2>Aufgabe ${task.number??i+1} · ${display(task.title)}</h2><p>Wird nach Abschluss der vorherigen Aufgabe freigeschaltet.</p></section>`;
    return `<section class="task ${done?'completed':''}" id="task-${task.id}" tabindex="-1"><div class="task-heading"><div>${done?`<span class="badge">${escape(engine.statusLabel(task.id))}</span>`:''}<h2>Aufgabe ${task.number??i+1} · ${display(task.title)}</h2></div>${done?button(collapsed?'Ausklappen +':'Einklappen −','toggle',`data-id="${task.id}" aria-expanded="${!collapsed}" aria-controls="body-${task.id}"`):''}</div><div id="body-${task.id}" ${collapsed?'hidden':''}>${window.ChemistryTaskUI.render(task,engine,{notebookInstruction:!content.sections[engine.state.section].notebookInstruction})}</div></section>`;
  }
  function renderMaterials(section) {
    const origin=materialReturn&&content.sections[materialReturn.section];
    const returnIndex=origin?.tasks.findIndex(task=>task.id===materialReturn.taskId)??-1;
    const returnNumber=returnIndex>=0?(origin.tasks[returnIndex].number??returnIndex+1):null;
    function materialBody(material) {
      if(!material.blocks)return `<p>${display(material.text)}</p>`;
      return material.blocks.map(block=>{
        if(block.kind==='heading')return `<h3>${display(block.text)}</h3>`;
        if(block.kind==='equation')return `<p class="word-equation">${display(block.text)}</p>`;
        if(block.kind==='image')return `<figure class="material-figure"><img src="${escape(block.src)}" alt="${display(block.alt)}" loading="eager"><figcaption>${display(block.caption||'')}</figcaption></figure>`;
        if(block.kind==='steps'||block.kind==='list') {const tag=block.kind==='steps'?'ol':'ul';return `<${tag}>${block.items.map(item=>`<li>${display(item)}</li>`).join('')}</${tag}>`;}
        if(block.kind==='help')return `<details class="material-help"><summary>${display(block.title)}</summary><ol>${block.items.map(item=>`<li>${display(item)}</li>`).join('')}</ol></details>`;
        return `<p>${display(block.text)}</p>`;
      }).join('');
    }
    if(!section.materials.length)return '';
    return `<section id="section-materials" aria-label="Materialien dieses Lernabschnitts"><div id="material-return">${returnIndex>=0?button('↓ Zurück zu Aufgabe '+returnNumber,'return-task'):origin?button('↓ Zurück zum Lernabschnitt','return-task'):''}</div>${section.materials.map((m,i)=>`<article class="panel material" id="material-${section.id}-${i+1}"><span class="badge">Material ${materialNumber(engine.state.section,i)}</span><h2>${display(m.title)}</h2>${materialBody(m)}</article>`).join('')}</section>`;
  }
  function renderOverview() {
    main.innerHTML = `<p class="eyebrow">Dein Lernstand</p><h1>Übersicht</h1><p>${overviewCount()}</p><p>${starsExplanation}</p>${overviewSections()}${starsSummary()}<div class="actions">${button('Weiterarbeiten','resume','class="primary"')}${button('Neu beginnen','reset')}</div>${requiredDone()?`<section class="panel report-controls"><h2>Persönlicher Lernstand</h2><p>Name und Klasse sind freiwillig und werden nur für den Ausdruck verwendet.</p><div class="report-fields"><label class="text-field">Name<input id="print-name" autocomplete="off" type="text"></label><label class="text-field">Klasse<input id="print-class" autocomplete="off" type="text"></label></div>${button('Lernstand drucken / als PDF speichern','print-overview','class="primary"')}</section>`:''}`;
  }
  function closeDialog() { backdrop.hidden=true; returnFocus?.focus(); }
  document.addEventListener('click',event=>{
    const target=event.target.closest('[data-action]'); if(!target || target.disabled)return;
    const action=target.dataset.action;
    if(action==='print-overview') { printOverview(); return; }
    if(action==='reset') { returnFocus=target; backdrop.hidden=false; document.querySelector('#cancel-reset').focus(); return; }
    if(action==='start') { engine.start(); view='section'; }
    if(action==='resume')view='section';
    if(action==='section') { if(engine.navigate(Number(target.dataset.index)))view='section'; }
    if(action==='material') {
      materialReturn={section:engine.state.section,taskId:target.dataset.id||null};
      const section=content.sections[engine.state.section];
      const source=section.materials.length?engine.state.section:content.sections.findIndex(s=>s.id===section.materialSection);
      if(source<0)return;
      engine.navigate(source);view='section';render();
      scrollToTarget(section.materialAnchor||'section-materials');return;
    }
    if(action==='return-task'&&materialReturn) {
      const origin=materialReturn;engine.navigate(origin.section);view='section';render();
      if(origin.taskId)scrollToTarget('task-'+origin.taskId);else{main.focus();window.scrollTo(0,0);}
      return;
    }
    if(['hint','differentiated','check','written','comparison','toggle'].includes(action)) {
      const id=target.dataset.id,position=window.scrollY;
      if(action==='hint')engine.revealHint(id);
      if(action==='differentiated')engine.revealDifferentiated(id);
      if(action==='check')engine.check(id);
      if(action==='written')engine.markWritten(id);
      if(action==='comparison')engine.toggleComparison(id);
      if(action==='toggle')engine.toggle(id);
      render();
      const focusTarget=action==='hint'?document.getElementById('hints-'+id):action==='differentiated'?document.getElementById('differentiated-'+id):document.getElementById('task-'+id);
      focusTarget?.focus({preventScroll:true});
      window.scrollTo({top:position,behavior:'auto'});
      return;
    }
    if(action==='overview')view=action;
    if(['section','next','back'].includes(action))materialReturn=null;
    if(action==='back') {if(view!=='section')view='section';else engine.navigate(engine.state.section-1);}
    if(action==='next') {if(view!=='section')view='section';else if(engine.sectionDone(engine.state.section)){if(engine.state.section===content.sections.length-1)view='overview';else engine.navigate(engine.state.section+1);}}
    render(true);
  });
  function captureAnswer(event) {
    const field=event.target;
    if(!field.matches('[data-unit]')||field.disabled)return;
    let value=field.value;
    if(field.dataset.kind==='single')value=Number(value);
    if(field.dataset.kind==='boolean')value=value==='true';
    if(field.dataset.kind==='multiple')value=Array.from(field.closest('fieldset').querySelectorAll('input:checked'),input=>Number(input.value));
    engine.answer(field.dataset.task,field.dataset.unit,value);
    if(field.tagName==='SELECT') {
      const task=content.sections.flatMap(s=>s.tasks).find(t=>t.id===field.dataset.task),units=window.ChemistryTasks.units(task),record=engine.record(task.id);
      const changed=units.find(u=>u.id===field.dataset.unit);
      if(changed.unique)for(const select of field.closest('.task').querySelectorAll('select[data-unit]')) {
        const unit=units.find(u=>u.id===select.dataset.unit);
        if(unit.group!==changed.group)continue;
        const used=units.filter(u=>u.id!==unit.id&&u.group===unit.group).map(u=>record.units[u.id].answer);
        for(const option of select.options)option.disabled=option.value!==''&&option.value!==select.value&&used.includes(option.value);
      }
    }
    if(!engine.storageAvailable&&!main.querySelector('.storage-warning'))main.insertAdjacentHTML('afterbegin',warning());
  }
  document.addEventListener('input',captureAnswer);
  document.addEventListener('change',captureAnswer);
  document.querySelector('#cancel-reset').addEventListener('click',closeDialog);
  document.querySelector('#confirm-reset').addEventListener('click',()=>{engine.reset();materialReturn=null;backdrop.hidden=true;view='home';render(true);});
  backdrop.addEventListener('keydown',event=>{if(event.key==='Escape')closeDialog();if(event.key==='Tab'){const first=document.querySelector('#cancel-reset'),last=document.querySelector('#confirm-reset');if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
  render();
})();






</script>
</body>
</html>
